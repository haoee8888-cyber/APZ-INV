<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory QR Scanner</title>

  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inventory">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">

  <!-- External Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">Mobile Inventory</h1>
      <p id="sync-status" class="text-xs text-indigo-200">Connecting to Google Sheets...</p>
    </div>
    <div class="flex gap-2">
      <button onclick="fetchInventoryFromSheet()" class="bg-indigo-700 hover:bg-indigo-800 text-white text-xs px-2.5 py-1.5 rounded font-medium shadow">
        ↻ Refresh
      </button>
      <button id="pwa-install-btn" class="hidden bg-white text-indigo-600 text-xs px-2.5 py-1.5 rounded-full font-bold shadow">
        Install
      </button>
    </div>
  </header>

  <main class="flex-1 p-4 max-w-md mx-auto w-full space-y-4">

    <!-- QR Scanner Section -->
    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="text-lg font-semibold mb-2">QR Code Scanner</h2>
      <div id="reader" class="overflow-hidden rounded-lg bg-black text-white min-h-[200px] flex items-center justify-center"></div>
      <button id="scan-btn" onclick="toggleScanner()" class="mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">
        Start Camera Scan
      </button>
    </div>

    <!-- Search Part -->
    <div class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="text-lg font-semibold">Search Part</h2>
      <div class="flex gap-2">
        <input id="part-input" type="text" placeholder="Part # or Name" class="flex-1 border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        <button onclick="searchPart()" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-medium">Find</button>
      </div>
    </div>

    <!-- Item Details & Transaction Form -->
    <div id="item-card" class="hidden bg-white rounded-xl shadow p-4 space-y-3 border-l-4 border-indigo-600">
      <div>
        <div class="flex justify-between items-start">
          <h3 id="card-title" class="text-lg font-bold text-slate-900"></h3>
          <span id="card-partno" class="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded font-mono"></span>
        </div>
        <p class="text-sm text-slate-500 mt-1">Location: <span id="card-location" class="font-semibold text-slate-700"></span></p>
        <p class="text-2xl font-black text-indigo-600 mt-2">Qty: <span id="card-qty"></span></p>
      </div>

      <hr>

      <!-- Transaction Actions -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500 uppercase">Stock Transaction</label>
        <input id="txn-qty" type="number" value="1" min="1" class="w-full border rounded-lg px-3 py-2 font-medium">
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button id="btn-receive" onclick="updateStock('receive')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-semibold transition">
            + Receive
          </button>
          <button id="btn-sell" onclick="updateStock('sell')" class="bg-rose-600 hover:bg-rose-700 text-white py-2 rounded-lg font-semibold transition">
            - Sell Out
          </button>
        </div>
      </div>
    </div>

    <!-- Inventory Table -->
    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="text-lg font-semibold mb-3">All Items</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
            <tr>
              <th class="p-2">Part</th>
              <th class="p-2">Qty</th>
              <th class="p-2">Loc</th>
            </tr>
          </thead>
          <tbody id="inventory-list" class="divide-y"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    const API_URL = "https://script.google.com/macros/s/AKfycbyqAw-fce4reD5Q1Ps7pO4fKcCVQKXn5ClhKSmGlDZIv1fzwEVGlaj6ifhOHCPFVWE/exec";

    let inventory = [];
    let selectedItem = null;
    let html5QrcodeScanner = null;
    let isScanning = false;

    // Fetch live data from Google Sheet
    async function fetchInventoryFromSheet() {
      const statusEl = document.getElementById('sync-status');
      statusEl.innerText = "Syncing with Google Sheet...";
      try {
        const response = await fetch(API_URL);
        inventory = await response.json();
        renderInventoryTable();
        statusEl.innerText = "● Connected to Google Sheet";
        statusEl.className = "text-xs text-emerald-200";

        if (selectedItem) {
          selectItem(selectedItem.partNo);
        }
      } catch (err) {
        console.error(err);
        statusEl.innerText = "✖ Offline / Sync Error";
        statusEl.className = "text-xs text-rose-200";
      }
    }

    function renderInventoryTable() {
      const tbody = document.getElementById('inventory-list');
      if (inventory.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-400">Loading data...</td></tr>`;
        return;
      }
      tbody.innerHTML = inventory.map(item => `
        <tr class="hover:bg-slate-50 cursor-pointer" onclick="selectItem('${item.partNo}')">
          <td class="p-2">
            <div class="font-medium">${item.name}</div>
            <div class="text-xs text-slate-400 font-mono">${item.partNo}</div>
          </td>
          <td class="p-2 font-bold ${item.qty < 10 ? 'text-rose-600' : 'text-slate-700'}">${item.qty}</td>
          <td class="p-2 text-xs text-slate-500">${item.location}</td>
        </tr>
      `).join('');
    }

    function selectItem(partNo) {
      selectedItem = inventory.find(i => 
        String(i.partNo).toLowerCase() === String(partNo).toLowerCase() || 
        String(i.name).toLowerCase() === String(partNo).toLowerCase()
      );
      
      const card = document.getElementById('item-card');
      if (selectedItem) {
        document.getElementById('card-title').innerText = selectedItem.name;
        document.getElementById('card-partno').innerText = selectedItem.partNo;
        document.getElementById('card-location').innerText = selectedItem.location;
        document.getElementById('card-qty').innerText = selectedItem.qty;
        card.classList.remove('hidden');
      } else {
        alert("Item not found in Google Sheet!");
        card.classList.add('hidden');
      }
    }

    function searchPart() {
      const query = document.getElementById('part-input').value.trim();
      if (query) selectItem(query);
    }

    // Sync quantity updates directly back to Google Sheet
    async function updateStock(type) {
      if (!selectedItem) return;
      const amount = parseInt(document.getElementById('txn-qty').value) || 0;
      if (amount <= 0) return alert("Enter a valid quantity.");

      let newQty = selectedItem.qty;
      if (type === 'sell') {
        if (amount > selectedItem.qty) return alert("Insufficient stock!");
        newQty -= amount;
      } else {
        newQty += amount;
      }

      // UI update optimization
      const btnReceive = document.getElementById('btn-receive');
      const btnSell = document.getElementById('btn-sell');
      btnReceive.disabled = true;
      btnSell.disabled = true;
      document.getElementById('sync-status').innerText = "Updating Google Sheet...";

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors', // Bypasses Google Apps Script CORS restrictions
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            partNo: selectedItem.partNo,
            qty: newQty
          })
        });

        // Update local object & refresh UI
        selectedItem.qty = newQty;
        document.getElementById('card-qty').innerText = newQty;
        renderInventoryTable();
        document.getElementById('sync-status').innerText = "● Updated in Sheet";
      } catch (err) {
        alert("Failed to update Google Sheet: " + err);
      } finally {
        btnReceive.disabled = false;
        btnSell.disabled = false;
      }
    }

    function toggleScanner() {
      const btn = document.getElementById('scan-btn');
      if (isScanning) {
        html5QrcodeScanner.stop().then(() => {
          isScanning = false;
          btn.innerText = "Start Camera Scan";
          btn.className = "mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition";
        });
      } else {
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 200, height: 200 } },
          (decodedText) => {
            selectItem(decodedText);
            toggleScanner();
          },
          () => {}
        ).catch(err => alert("Camera error: " + err));

        isScanning = true;
        btn.innerText = "Stop Camera";
        btn.className = "mt-3 w-full bg-rose-600 hover:bg-rose-700 text-white font-medium py-2 rounded-lg transition";
      }
    }

    // Initial load on launch
    fetchInventoryFromSheet();
  </script>
</body>
</html>
