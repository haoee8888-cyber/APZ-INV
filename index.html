<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory QR Scanner</title>

  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inventory">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">

  <!-- External Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">Mobile Inventory</h1>
      <p id="sync-status" class="text-xs text-indigo-200">Connecting to Google Sheets...</p>
    </div>
    <div class="flex gap-2">
      <button onclick="fetchInventoryFromSheet()" class="bg-indigo-700 hover:bg-indigo-800 text-white text-xs px-2.5 py-1.5 rounded font-medium shadow">
        ↻ Refresh
      </button>
      <button id="pwa-install-btn" class="hidden bg-white text-indigo-600 text-xs px-2.5 py-1.5 rounded-full font-bold shadow">
        Install
      </button>
    </div>
  </header>

  <main class="flex-1 p-4 max-w-md mx-auto w-full space-y-4">

    <!-- QR Scanner Section -->
    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="text-lg font-semibold mb-2">QR Code Scanner</h2>
      <div id="reader" class="overflow-hidden rounded-lg bg-black text-white min-h-[200px] flex items-center justify-center"></div>
      <button id="scan-btn" onclick="toggleScanner()" class="mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">
        Start Camera Scan
      </button>
    </div>

    <!-- Keyword Search Input -->
    <div class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="text-lg font-semibold">Search Part (Keyword)</h2>
      <form onsubmit="event.preventDefault(); searchPart();" class="flex gap-2">
        <input id="part-input" type="text" placeholder="Enter keyword (e.g. oil, sedan, 101)" class="flex-1 border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-medium">Find</button>
      </form>
    </div>

    <!-- Item Details & Transaction Form -->
    <div id="item-card" class="hidden bg-white rounded-xl shadow p-4 space-y-3 border-l-4 border-indigo-600">
      <div>
        <div class="flex justify-between items-start">
          <h3 id="card-title" class="text-lg font-bold text-slate-900"></h3>
          <span id="card-partno" class="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded font-mono"></span>
        </div>
        <!-- Description -->
        <p id="card-desc" class="text-sm text-slate-600 mt-1 italic"></p>
        <p class="text-sm text-slate-500 mt-2">Location: <span id="card-location" class="font-semibold text-slate-700"></span></p>
        <p class="text-2xl font-black text-indigo-600 mt-2">Qty: <span id="card-qty"></span></p>
      </div>

      <hr>

      <!-- Transaction Actions -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500 uppercase">Stock Transaction</label>
        <input id="txn-qty" type="number" value="1" min="1" class="w-full border rounded-lg px-3 py-2 font-medium">
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button id="btn-receive" onclick="updateStock('receive')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-semibold transition">
            + Receive
          </button>
          <button id="btn-sell" onclick="updateStock('sell')" class="bg-rose-600 hover:bg-rose-700 text-white py-2 rounded-lg font-semibold transition">
            - Sell Out
          </button>
        </div>
      </div>
    </div>

    <!-- Inventory Table with Description -->
    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="text-lg font-semibold mb-3">All Items</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
            <tr>
              <th class="p-2">Item & Description</th>
              <th class="p-2">Qty</th>
              <th class="p-2">Loc</th>
            </tr>
          </thead>
          <tbody id="inventory-list" class="divide-y"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    const API_URL = "https://script.google.com/macros/s/AKfycbzfaHw7qXBnNSEaeLbyaRHckbVG1htehq4VdahfGaTnZTYIpyGcAGmenjGDBWU9_cg/exec";

    let inventory = [];
    let selectedItem = null;
    let html5QrcodeScanner = null;
    let isScanning = false;

    // Register Service Worker for Offline Capabilities
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered.'))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    // PWA Install Prompt Handler
    let deferredPrompt;
    const installBtn = document.getElementById('pwa-install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
    });

    installBtn.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            installBtn.classList.add('hidden');
          }
          deferredPrompt = null;
        });
      }
    });

    // Fetch live inventory data from Google Sheets
    async function fetchInventoryFromSheet() {
      const statusEl = document.getElementById('sync-status');
      statusEl.innerText = "Syncing with Google Sheet...";
      try {
        const response = await fetch(API_URL);
        inventory = await response.json();
        renderInventoryTable();
        statusEl.innerText = "● Connected to Google Sheet";
        statusEl.className = "text-xs text-emerald-200";

        if (selectedItem) {
          selectItem(selectedItem.partNo);
        }
      } catch (err) {
        console.error(err);
        statusEl.innerText = "✖ Offline / Sync Error";
        statusEl.className = "text-xs text-rose-200";
      }
    }

    // Render Table with Item Name, Part No, and Description
    function renderInventoryTable() {
      const tbody = document.getElementById('inventory-list');
      if (inventory.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-400">Loading data...</td></tr>`;
        return;
      }
      tbody.innerHTML = inventory.map(item => `
        <tr class="hover:bg-slate-50 cursor-pointer" onclick="selectItem('${item.partNo}')">
          <td class="p-2">
            <div class="font-medium text-slate-900">${item.name}</div>
            <div class="text-xs text-indigo-600 font-mono font-semibold">${item.partNo}</div>
            ${item.description ? `<div class="text-xs text-slate-500 mt-0.5 line-clamp-1">${item.description}</div>` : ''}
          </td>
          <td class="p-2 font-bold ${item.qty < 10 ? 'text-rose-600' : 'text-slate-700'}">${item.qty}</td>
          <td class="p-2 text-xs text-slate-500">${item.location}</td>
        </tr>
      `).join('');
    }

    // Search using partial keyword matching (searches partNo, name, AND description)
    function searchPart() {
      const query = document.getElementById('part-input').value.trim().toLowerCase();
      
      if (!query) {
        alert("Please enter a keyword to search.");
        return;
      }

      const matches = inventory.filter(item => 
        String(item.partNo).toLowerCase().includes(query) || 
        String(item.name).toLowerCase().includes(query) ||
        String(item.description || '').toLowerCase().includes(query)
      );

      if (matches.length === 0) {
        alert(`No items found matching keyword: "${query}"`);
        document.getElementById('item-card').classList.add('hidden');
      } else if (matches.length === 1) {
        displayItemCard(matches[0]);
      } else {
        displayItemCard(matches[0]);
        alert(`Found ${matches.length} items matching "${query}". Displaying first match: ${matches[0].name}`);
      }
    }

    // Render selected item inside details card
    function displayItemCard(item) {
      selectedItem = item;
      const card = document.getElementById('item-card');
      
      document.getElementById('card-title').innerText = selectedItem.name;
      document.getElementById('card-partno').innerText = selectedItem.partNo;
      document.getElementById('card-desc').innerText = selectedItem.description || 'No description available.';
      document.getElementById('card-location').innerText = selectedItem.location;
      document.getElementById('card-qty').innerText = selectedItem.qty;
      
      card.classList.remove('hidden');
    }

    // Helper for table selection and QR code detection
    function selectItem(identifier) {
      const query = String(identifier).trim().toLowerCase();

      const item = inventory.find(i => String(i.partNo).toLowerCase() === query) ||
                   inventory.find(i => String(i.name).toLowerCase() === query) ||
                   inventory.find(i => String(i.partNo).toLowerCase().includes(query) || 
                                       String(i.name).toLowerCase().includes(query) ||
                                       String(i.description || '').toLowerCase().includes(query));

      if (item) {
        displayItemCard(item);
      } else {
        alert(`Item "${identifier}" not found in inventory.`);
        document.getElementById('item-card').classList.add('hidden');
      }
    }

    // Update stock quantity and submit transaction log
    async function updateStock(type) {
      if (!selectedItem) return;
      const amount = parseInt(document.getElementById('txn-qty').value) || 0;
      if (amount <= 0) return alert("Enter a valid quantity.");

      let changeQty = (type === 'sell') ? -amount : amount;
      let newQty = selectedItem.qty + changeQty;

      if (type === 'sell' && amount > selectedItem.qty) {
        return alert("Insufficient stock!");
      }

      const btnReceive = document.getElementById('btn-receive');
      const btnSell = document.getElementById('btn-sell');
      btnReceive.disabled = true;
      btnSell.disabled = true;
      document.getElementById('sync-status').innerText = "Updating Google Sheet...";

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            partNo: selectedItem.partNo,
            changeQty: changeQty,
            action: (type === 'sell') ? "SELL" : "RECEIVE"
          })
        });

        // Update local state & refresh interface
        selectedItem.qty = newQty;
        document.getElementById('card-qty').innerText = newQty;
        renderInventoryTable();
        document.getElementById('sync-status').innerText = "● Updated & Logged";
      } catch (err) {
        alert("Failed to update Google Sheet: " + err);
      } finally {
        btnReceive.disabled = false;
        btnSell.disabled = false;
      }
    }

    // Camera QR Code Scanner Toggle
    function toggleScanner() {
      const btn = document.getElementById('scan-btn');
      
      if (isScanning) {
        html5QrcodeScanner.stop().then(() => {
          isScanning = false;
          btn.innerText = "Start Camera Scan";
          btn.className = "mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition";
        });
      } else {
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 200, height: 200 } },
          (decodedText) => {
            selectItem(decodedText);
            toggleScanner();
          },
          () => {}
        ).catch(err => alert("Camera permission error: " + err));

        isScanning = true;
        btn.innerText = "Stop Camera";
        btn.className = "mt-3 w-full bg-rose-600 hover:bg-rose-700 text-white font-medium py-2 rounded-lg transition";
      }
    }

    // Initial load on page load
    fetchInventoryFromSheet();
  </script>
</body>
</html>
